<!-- ============================================================
    HEADER / NAVBAR (Always Visible)
    ============================================================ -->

<header class="site-header" id="header">

    <!-- LOGO -->
    <div class="logo-wrapper">
        <div>
            <span class="logo">GiftAura<span class="star">✦</span></span>
            <span class="logo-sub">MADE WITH LOVE, JUST FOR YOU</span>
        </div>
    </div>

    <!-- NAV LINKS — Always visible -->
    <nav class="nav-links" id="navLinks">
        <a href="/" class="nav-link">Home</a>
        <a href="/about" class="nav-link">About Us</a>
        <a href="/contact" class="nav-link">Contact</a>
    </nav>

    <!-- HEADER ACTIONS (No hamburger) -->
    <div class="header-actions">
        <!-- Optional: Add search, cart, or profile icons here -->
    </div>
</header>

<!-- ===== NAVBAR ACTIVE STATE SCRIPT ===== -->
<script>
    // Highlight current page in navbar
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');

        navLinks.forEach(link => {
            // Remove any existing active class
            link.classList.remove('active');

            // Check if the link's href matches the current path
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
            }

            // Special case: Home page (path is "/")
            if (currentPath === '/' && link.getAttribute('href') === '/') {
                link.classList.add('active');
            }
        });
    });
</script>
